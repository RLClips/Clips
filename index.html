<!DOCTYPE html>
<html>
<head>
    <title>RL Clips</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            height: 65px;
            background: #181818;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .upload-button {
            background: #00aaff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .upload-button:hover {
            background: #008dcc;
        }

        .feed {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding-top: 85px;
        }

        .clip {
            background: #181818;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
        }

        video {
            width: 100%;
            max-height: 650px;
            display: block;
            background: black;
        }

        .clip-info {
            padding: 15px;
        }

        .username {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .caption {
            color: #ccc;
            margin-bottom: 12px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .action-button {
            background: #292929;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
        }

        .action-button:hover {
            background: #383838;
        }

        .empty-message {
            text-align: center;
            color: #777;
            padding: 30px;
        }
    </style>
</head>


<body>

<header>

    <div class="logo">
        RL CLIPS
    </div>

    <button class="upload-button" onclick="uploadClip()">
        + Upload Clip
    </button>

</header>


<main class="feed">

    <!-- UPLOADED CLIPS WILL APPEAR HERE -->

    <div id="uploadedClips"></div>


    <!-- TEST CLIP 1 -->

    <div class="clip">

        <video controls>
            <source
                src="https://cdn.coverr.co/videos/coverr-a-car-driving-on-a-road-1577/1080p.mp4"
                type="video/mp4">
        </video>

        <div class="clip-info">

            <div class="username">
                @RLPlayer
            </div>

            <div class="caption">
                Insane Rocket League clip 🔥
            </div>

            <div class="actions">

                <button
                    class="action-button"
                    onclick="likeClip(this)">
                    ❤️ 0
                </button>

                <button
                    class="action-button"
                    onclick="commentClip()">
                    💬 Comment
                </button>

                <button
                    class="action-button"
                    onclick="shareClip()">
                    ↗ Share
                </button>

            </div>

        </div>

    </div>


    <!-- TEST CLIP 2 -->

    <div class="clip">

        <video controls>
            <source
                src="https://cdn.coverr.co/videos/coverr-driving-a-car-1578/1080p.mp4"
                type="video/mp4">
        </video>

        <div class="clip-info">

            <div class="username">
                @OctaneMain
            </div>

            <div class="caption">
                BRO WHAT WAS THAT 😭
            </div>

            <div class="actions">

                <button
                    class="action-button"
                    onclick="likeClip(this)">
                    ❤️ 0
                </button>

                <button
                    class="action-button"
                    onclick="commentClip()">
                    💬 Comment
                </button>

                <button
                    class="action-button"
                    onclick="shareClip()">
                    ↗ Share
                </button>

            </div>

        </div>

    </div>

</main>


<script>

function uploadClip() {

    const input = document.createElement("input");

    input.type = "file";

    input.accept = "video/*";


    input.onchange = function(event) {

        const file = event.target.files[0];

        if (!file) {
            return;
        }


        const videoURL = URL.createObjectURL(file);


        const clip = document.createElement("div");

        clip.className = "clip";


        clip.innerHTML = `

            <video controls autoplay>

                <source
                    src="${videoURL}"
                    type="${file.type}">

            </video>


            <div class="clip-info">

                <div class="username">
                    @You
                </div>


                <div class="caption">
                    My Rocket League clip 🔥
                </div>


                <div class="actions">

                    <button
                        class="action-button"
                        onclick="likeClip(this)">
                        ❤️ 0
                    </button>


                    <button
                        class="action-button"
                        onclick="commentClip()">
                        💬 Comment
                    </button>


                    <button
                        class="action-button"
                        onclick="shareClip()">
                        ↗ Share
                    </button>

                </div>

            </div>
        `;


        const uploadedClips =
            document.getElementById("uploadedClips");

        uploadedClips.prepend(clip);

    };
    

    input.click();
}



function likeClip(button) {

    let number =
        parseInt(
            button.innerText.replace("❤️ ", "")
        );

    number++;

    button.innerText =
        "❤️ " + number;
}



function commentClip() {

    alert("Comments are coming soon!");

}



function shareClip() {

    alert("Sharing is coming soon!");

}

</script>


</body>
</html>
