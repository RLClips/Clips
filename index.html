<!DOCTYPE html>
<html>

        body {

        }

        header {
            height: 60px;
            background: #181818;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        button {
            background: #00aaff;
            color: white;

            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        main {
            max-width: 600px;
            margin: auto;
        }

        .clip {
            height: 500px;
            background: #222;
            margin: 20px 0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">RL CLIPS</div>

    <button onclick="uploadClip()">
        + Upload Clip
    </button>
</header>

<main>

    <div class="clip">
        Your Rocket League clips will appear here
    </div>

</main>

<script>

function uploadClip() {
    alert("Upload system coming next!");
}

</script>

</body>
</html>
